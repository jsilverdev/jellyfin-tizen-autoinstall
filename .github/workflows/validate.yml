name: Validate installers

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n ./install.sh
      - name: Run Linux integration tests
        run: bash ./tests/integration-linux.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run Windows integration tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-integration-tests.log'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\integration-windows.ps1 *> $log
          $exitCode = $LASTEXITCODE
          @(
            '### Windows integration tests'
            ''
            '```text'
            (Get-Content -LiteralPath $log -Raw)
            '```'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath $log
          exit $exitCode

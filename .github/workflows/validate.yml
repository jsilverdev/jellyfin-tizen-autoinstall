name: Validate installers

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n ./install.sh
      - name: Run Linux integration tests
        run: bash ./tests/integration-linux.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run Windows integration tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-integration-tests.log'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\integration-windows.ps1 *> $log
          $exitCode = $LASTEXITCODE
          @(
            '### Windows integration tests'
            ''
            '```text'
            (Get-Content -LiteralPath $log -Raw)
            '```'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath $log
          exit $exitCode
      - name: Publish Windows failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-integration-tests.log'
          if (Test-Path -LiteralPath $log) {
            $content = Get-Content -LiteralPath $log -Raw
          }
          else {
            $content = 'Windows integration test log was not created.'
          }
          $body = "<!-- integration-ci-diagnostic -->`n### Windows integration diagnostics`n```text`n$content`n```"
          gh pr comment ${{ github.event.pull_request.number }} --body $body --edit-last --create-if-none

name: Validate installers

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n ./install.sh
      - name: Run Linux integration tests
        run: bash ./tests/integration-linux.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run Windows integration tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-integration-tests.log'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\integration-windows.ps1 *> $log
          $exitCode = $LASTEXITCODE
          Get-Content -LiteralPath $log
          exit $exitCode
      - name: Publish Windows failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-integration-tests.log'
          $content = if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Raw } else { 'missing log' }
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($content))
          gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --raw-field "body=integration-ci-diagnostic-base64:$encoded"
